name: Build Big Bazer Bejjur APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_DIR"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_DIR"
          mkdir -p "$ANDROID_SDK_DIR/licenses" 2>/dev/null || sudo mkdir -p "$ANDROID_SDK_DIR/licenses"
          sudo chmod -R a+rwX "$ANDROID_SDK_DIR" 2>/dev/null || true

          cat <<'EOF' > "$ANDROID_SDK_DIR/licenses/android-sdk-license"
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > "$ANDROID_SDK_DIR/licenses/android-googletv-license"
          echo "ceff83576aac4f7f37cb98fe189e9fb3c49d3b81" > "$ANDROID_SDK_DIR/licenses/android-googlexr-license"
          echo "859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_SDK_DIR/licenses/android-sdk-arm-dbt-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_DIR/licenses/android-sdk-preview-license"
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$ANDROID_SDK_DIR/licenses/google-gdk-license"
          echo "3a7848b1d7366ca5cfa0be477627644ca73f47e3" > "$ANDROID_SDK_DIR/licenses/microxr-sysimage-license"
          echo "e9acab5b5fbb560a72cfaecce8946896ff6aab9d" > "$ANDROID_SDK_DIR/licenses/mips-android-sysimage-license"

          SDKMANAGER="$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1 || true)
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Firebase-registered debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json from GitHub Secret if omitted
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            else
              echo "WARNING: app/google-services.json missing. Add GOOGLE_SERVICES_JSON secret in GitHub repo settings for Firebase Auth & Firestore."
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK for mobile download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BigBazerBejjur-debug.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigBazerBejjur-debug-apk
          path: BigBazerBejjur-debug.apk
          retention-days: 30

      - name: Publish direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest BigBazerBejjur-debug.apk --clobber
          else
            gh release create latest BigBazerBejjur-debug.apk \
              --title "Big Bazer Bejjur APK (Latest)" \
              --notes "Tap BigBazerBejjur-debug.apk below to download and install directly on Android mobile."
          fi
